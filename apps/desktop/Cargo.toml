# Dioramic desktop: a workspace of its own (the root workspace excludes `apps/`).
#
#   ipc        — serde DTOs shared by the Tauri backend and the Leptos frontend (no engine deps, wasm-friendly)
#   src-tauri  — Tauri 2 backend: commands calling `dioramic_render::Engine`, file tree, file watcher
#   ui         — Leptos CSR frontend compiled to wasm by `trunk`
[workspace]
resolver = "3"
members = ["ipc", "src-tauri", "ui"]
# `cargo build`/`cargo test` at this root only touch the native crates; the UI is built by trunk.
default-members = ["ipc", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dioramic/dioramic"
authors = ["Dioramic contributors"]

# Versions checked on crates.io on 2026-10-09 (T-203).
[workspace.dependencies]
dioramic-desktop-ipc = { path = "ipc" }
dioramic-spec = { path = "../../crates/dioramic-spec" }
dioramic-render = { path = "../../crates/dioramic-render" }
# Flat icon registry type and the icon packs on disk (installed packs + the project `icons/`, T-391).
dioramic-core = { path = "../../crates/dioramic-core" }
dioramic-packs = { path = "../../crates/dioramic-packs" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.3.0"
# CST editing of JSON specs keeps their formatting (same crate/version as `dioramic-cli init`, T-360).
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json"] }
thiserror = "2.0.21"

tauri = { version = "2.12.2", features = [] }
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-dialog = "2.8.1"
notify = "8.2.0"
tempfile = "3.27.0"

leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.106"
web-sys = "0.3.106"
console_error_panic_hook = "0.1.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
# resvg/GIF encoders crawl without optimization, even in debug builds.
opt-level = 2

[profile.release.package.dioramic-desktop-ui]
# Smaller wasm for the webview.
opt-level = "s"
